name: agent

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["agent/**", ".github/workflows/agent.yml"]
  pull_request:
    paths: ["agent/**", ".github/workflows/agent.yml"]

concurrency:
  group: agent-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # only used by the release step on tags

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # dist.sh names the version after the agent's last commit
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: GOOS=darwin go vet ./...
      - run: go test -race ./...
      # Tags give release versions (v1.2.0); everything else is the date and
      # commit of the agent's last change.
      - name: build install bundle
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then scripts/dist.sh "$GITHUB_REF_NAME"; else scripts/dist.sh; fi
      - uses: actions/upload-artifact@v4
        with:
          name: monitor-agent-dist
          path: agent/dist/
      # Tagging vX.Y.Z publishes the bundle as a release of this (private) repo.
      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "agent $GITHUB_REF_NAME" --generate-notes
