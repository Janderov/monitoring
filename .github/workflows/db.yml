name: db

on:
  push:
    branches: [main]
    paths: ["db/**", ".github/workflows/db.yml"]
  pull_request:
    paths: ["db/**", ".github/workflows/db.yml"]

concurrency:
  group: db-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Applies every migration to an empty PostgreSQL 18 (the version the hub runs)
  # and runs the SQL checks in db/tests.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: db/check.sh
