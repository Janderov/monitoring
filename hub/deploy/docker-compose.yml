# The hub and its database on one small VPS. PostgreSQL is reachable only by
# the hub inside this compose network. The hub connects out (to the agents and
# to healthchecks.io) and answers one thing: clients' report links /r/<token>,
# on 127.0.0.1:8080 of the VPS. To give clients those links over HTTPS, point
# a domain at the VPS and start with the `web` profile (install.sh does it when
# you give it a domain): Caddy gets the certificate and passes /r/… to the hub.
#   HUB_DOMAIN=reports.example.com HUB_PUBLIC_URL=https://reports.example.com \
#   COMPOSE_PROFILES=web docker compose up -d
#
# Secrets are files in ./secrets (install.sh makes them, mode 600):
#   secret-key     encryption key for agent tokens in the database
#   db-password    PostgreSQL password
#   heartbeat-url  healthchecks.io ping address (empty file = no pulse)
name: monitor-hub

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: monitor
      POSTGRES_DB: monitor
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
    secrets: [db-password]
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "monitor", "-d", "monitor"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256mb

  hub:
    image: monitor-hub:latest
    build:
      context: ../..
      dockerfile: hub/deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: monitor
      PGDATABASE: monitor
      HUB_NAME: ${HUB_NAME:-Хаб}
      HUB_HTTP: 0.0.0.0:8080
      HUB_PUBLIC_URL: ${HUB_PUBLIC_URL:-}
      HUB_PDF_URL: http://pdf:3000
      TZ: Europe/Moscow
    secrets: [secret-key, db-password, heartbeat-url]
    ports:
      - 127.0.0.1:8080:8080
    networks: [default, pdf]
    volumes:
      - ./import:/import:ro
      - files:/var/lib/monitor-hub/files

  # Prints report pages to PDF (Chromium). No internet, no scripts, only the hub reaches it.
  pdf:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command: ["gotenberg", "--chromium-disable-javascript=true", "--libreoffice-disable-routes=true",
              "--webhook-disable=true", "--api-timeout=60s"]
    networks: [pdf]

  # HTTPS for the report links (profile `web`): a certificate from Let's Encrypt for HUB_DOMAIN.
  web:
    image: caddy:2
    restart: unless-stopped
    profiles: [web]
    depends_on: [hub]
    command: ["caddy", "reverse-proxy", "--from", "${HUB_DOMAIN:-}", "--to", "hub:8080"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy:/data

  # A copy of the database every night, 14 days kept, in ./backups.
  backup:
    image: postgres:18
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: monitor
      PGDATABASE: monitor
      PGPASSFILE: /tmp/.pgpass
    secrets: [db-password]
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf 'db:5432:monitor:monitor:%s\n' "$$(cat /run/secrets/db-password)" > /tmp/.pgpass && chmod 600 /tmp/.pgpass
        while true; do
          f=/backups/monitor-$$(date +%F).dump
          pg_dump -Fc -f "$$f.tmp" && mv "$$f.tmp" "$$f" && echo "backup $$f"
          find /backups -name 'monitor-*.dump' -mtime +14 -delete
          sleep 86400
        done

secrets:
  secret-key:
    file: ./secrets/secret-key
  db-password:
    file: ./secrets/db-password
  heartbeat-url:
    file: ./secrets/heartbeat-url

networks:
  pdf:
    internal: true

volumes:
  pgdata:
  files:
  caddy:
