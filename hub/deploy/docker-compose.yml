# The hub and its database on one small VPS. PostgreSQL is reachable only by
# the hub inside this compose network. The only thing open to the internet is
# Caddy (ports 80/443, HTTPS certificate from Let's Encrypt) in front of the
# hub's web server: the staff cabinet and clients' report links /r/<token>,
# both on one domain, and only when a domain is set in ./.env (install.sh asks):
#   HUB_DOMAIN=hub.example.com
#   COMPOSE_PROFILES=web
#
# Secrets are files in ./secrets (install.sh makes them, mode 600):
#   secret-key     encryption key for agent tokens in the database
#   db-password    PostgreSQL password
#   heartbeat-url  healthchecks.io ping address (empty file = no pulse)
#   telegram-bot-token  the bot's token from @BotFather (empty file = no Telegram)
name: monitor-hub

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: monitor
      POSTGRES_DB: monitor
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
    secrets: [db-password]
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "monitor", "-d", "monitor"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256mb

  hub:
    image: monitor-hub:latest
    build:
      context: ../..
      dockerfile: hub/deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: monitor
      PGDATABASE: monitor
      HUB_NAME: ${HUB_NAME:-Хаб}
      # The web server (cabinet + report links) listens inside the compose
      # network; Caddy is its door, 127.0.0.1:8080 is for the VPS itself.
      HUB_HTTP: ${HUB_HTTP:-0.0.0.0:8080}
      HUB_PUBLIC_URL: ${HUB_DOMAIN:+https://${HUB_DOMAIN}}
      HUB_TRUST_PROXY: "1"
      HUB_PDF_URL: http://pdf:3000
      TZ: Europe/Moscow
    secrets: [secret-key, db-password, heartbeat-url, telegram-bot-token]
    ports:
      - 127.0.0.1:8080:8080
    networks: [default, pdf]
    volumes:
      - ./import:/import:ro
      - files:/var/lib/monitor-hub/files

  # Prints report pages to PDF (Chromium). No internet, no scripts, only the hub reaches it.
  pdf:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command: ["gotenberg", "--chromium-disable-javascript=true", "--libreoffice-disable-routes=true",
              "--webhook-disable=true", "--api-timeout=60s"]
    networks: [pdf]

  # HTTPS for the web cabinet and report links. Gets and renews the certificate by itself.
  caddy:
    image: caddy:2
    profiles: [web]
    restart: unless-stopped
    depends_on: [hub]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      HUB_DOMAIN: ${HUB_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # A copy of the database every night, 14 days kept, in ./backups.
  backup:
    image: postgres:18
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: monitor
      PGDATABASE: monitor
      PGPASSFILE: /tmp/.pgpass
    secrets: [db-password]
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf 'db:5432:monitor:monitor:%s\n' "$$(cat /run/secrets/db-password)" > /tmp/.pgpass && chmod 600 /tmp/.pgpass
        while true; do
          f=/backups/monitor-$$(date +%F).dump
          pg_dump -Fc -f "$$f.tmp" && mv "$$f.tmp" "$$f" && echo "backup $$f"
          find /backups -name 'monitor-*.dump' -mtime +14 -delete
          sleep 86400
        done

secrets:
  secret-key:
    file: ./secrets/secret-key
  db-password:
    file: ./secrets/db-password
  heartbeat-url:
    file: ./secrets/heartbeat-url
  telegram-bot-token:
    file: ./secrets/telegram-bot-token

networks:
  pdf:
    internal: true

volumes:
  pgdata:
  files:
  caddy-data:
  caddy-config:
